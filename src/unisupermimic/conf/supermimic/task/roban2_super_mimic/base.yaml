# @package _global_
defaults:
  - /task/g1_super_mimic/base
  - _self_

env:
  scene:
    model_file: src/unisupermimic/assets/robots/roban2/scene_supermimic.xml
    entities:
      robot:
        root_body_name: base_link
        joint_names: &roban2_joints
          - waist_yaw_joint
          - leg_l1_joint
          - leg_l2_joint
          - leg_l3_joint
          - leg_l4_joint
          - leg_l5_joint
          - leg_l6_joint
          - leg_r1_joint
          - leg_r2_joint
          - leg_r3_joint
          - leg_r4_joint
          - leg_r5_joint
          - leg_r6_joint
          - zarm_l1_joint
          - zarm_l2_joint
          - zarm_l3_joint
          - zarm_l4_joint
          - zarm_r1_joint
          - zarm_r2_joint
          - zarm_r3_joint
          - zarm_r4_joint
          - zhead_1_joint
          - zhead_2_joint
        actuator_names: *roban2_joints
        body_names:
          - base_link
          - waist_yaw_link
          - leg_l2_link
          - leg_l4_link
          - leg_l6_link
          - leg_r2_link
          - leg_r4_link
          - leg_r6_link
          - zarm_l2_link
          - zarm_l4_link
          - zarm_r2_link
          - zarm_r4_link
          - zhead_1_link
          - zhead_2_link
  observations:
    policy:
      terms:
        obs:
          func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_obs
    future:
      terms:
        goal:
          func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_goal
  actions:
    joint_pos:
      _target_: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.SuperMimicActionCfg
  commands:
    motion:
      _target_: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.SuperMimicCommandCfg
      mjcf_path: src/unisupermimic/assets/robots/roban2/roban2.xml
      src_fps: 120.0
      context_dim: 27
      motion_files:
        - ${oc.env:ROBAN2_DATASET_ROOT,/home/lyx/train/dataset/LET-HumanMotion-Roban2}/Non-Interactive_Actions/Basic_Gait_Category/Fast_Walking_Jogging/Jogging/Take_024_WangFuGui_to_soma_ZYX.npz
  events:
    startup_context:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.SuperMimicContextEvent
    reset_context:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.SuperMimicContextEvent
    joint_offsets:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.SuperMimicJointOffsetEvent
  terminations:
    hard:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_termination
    timeout:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_timeout
    clip_end:
      func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_clip_end

reward:
  tracking:
    func: unisupermimic.tasks.motion_tracking.roban2.supermimic.manager_terms.supermimic_reward
